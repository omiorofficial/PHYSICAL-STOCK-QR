<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>OMIOR QR Scanner</title>
  <style>
    :root{
      --bg:#fdf8f0;
      --card:#ffffff;
      --ink:#3a2a1a;
      --muted:#8a7561;
      --saffron:#d98e2c;
      --saffron-dark:#b8721a;
      --maroon:#8c2f39;
      --border:#ecdcc4;
      --success:#3f7d4a;
      --error:#b8423a;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; padding:16px 16px 48px;
      background:var(--bg);
      font-family:'Segoe UI', Roboto, Arial, sans-serif;
      color:var(--ink);
      display:flex; flex-direction:column; align-items:center;
    }
    .wrap{ width:100%; max-width:400px; }

    h1{font-size:20px; margin:0 0 4px; text-align:center;}
    .subtitle{color:var(--muted); font-size:13px; margin:0 0 16px; text-align:center;}

    .card{
      background:var(--card); border:1px solid var(--border); border-radius:12px;
      padding:16px; margin-bottom:14px;
    }
    .card h2{font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--saffron-dark); margin:0 0 12px;}

    label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px; margin-top:10px;}
    label:first-of-type{margin-top:0;}
    input[type=text]{
      width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;
      font-size:15px; background:#fffdfa; color:var(--ink);
    }

    .btn{
      width:100%; padding:14px; border-radius:10px; font-size:16px; font-weight:600;
      cursor:pointer; text-align:center; margin-bottom:10px; display:block; border:none;
    }
    .btn-primary{ background:var(--maroon); color:#fff; }
    .btn-secondary{ background:#fff; color:var(--saffron-dark); border:1px solid var(--saffron); }
    .btn-danger{ background:#fbe9e7; color:var(--error); border:1px solid var(--error); }
    .btn:disabled{ opacity:.5; cursor:default; }
    label.btn{ text-decoration:none; }
    #qr-input{ display:none; }

    #camera-wrap{
      width:100%; margin-bottom:10px; display:none; position:relative;
      border-radius:12px; overflow:hidden; border:2px solid var(--saffron);
    }
    video{ width:100%; display:block; background:#222; }
    #scan-line{
      position:absolute; left:5%; width:90%; height:2px;
      background:var(--saffron); pointer-events:none; box-shadow:0 0 8px var(--saffron);
      animation:scan 2s linear infinite;
    }
    @keyframes scan{ 0%{top:10%} 50%{top:85%} 100%{top:10%} }
    canvas{ display:none; }

    #camera-wrap::before, #camera-wrap::after, .corner-br, .corner-bl{
      content:''; position:absolute; width:22px; height:22px;
      border-color:var(--saffron); border-style:solid; z-index:3;
    }
    #camera-wrap::before{ top:8px; left:8px;  border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
    #camera-wrap::after { top:8px; right:8px; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
    .corner-br{ bottom:8px; right:8px; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
    .corner-bl{ bottom:8px; left:8px;  border-width:0 0 3px 3px; border-radius:0 0 0 4px; }

    #flash-overlay{
      position:absolute; inset:0;
      background:rgba(63,125,74,0.92);
      opacity:0; pointer-events:none;
      display:flex; align-items:center; justify-content:center;
      transition:opacity 0.15s; z-index:2;
    }
    #flash-overlay.show{ opacity:0.94; }
    #flash-overlay.invalid{ background:rgba(184,66,58,0.94); }
    #flash-overlay .ford{ font-size:24px; font-weight:800; color:#fff; text-align:center; padding:0 16px; }
    #flash-overlay .fwarn{ font-size:13px; font-weight:700; color:#fff; margin-top:6px; letter-spacing:0.5px; text-transform:uppercase; }

    #preview-wrap{ width:100%; margin-bottom:10px; display:none; }
    #preview{ width:100%; border-radius:12px; display:block; }

    #status-box{
      width:100%; padding:12px 16px; border-radius:8px;
      font-size:14px; font-weight:500; text-align:center; display:none;
      margin-bottom:12px; line-height:1.5;
    }
    #status-box.success{ display:block; background:#e8f3ea; color:var(--success); border:1px solid var(--success); }
    #status-box.error  { display:block; background:#fbe9e7; color:var(--error); border:1px solid var(--error); }
    #status-box.loading{ display:block; background:#fef3e2; color:var(--saffron-dark); border:1px solid var(--saffron); }

    #queue-header{
      display:flex; justify-content:space-between; align-items:baseline;
      margin-bottom:8px; font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase;
    }
    #queue-count{ color:var(--ink); font-weight:700; font-size:13px; letter-spacing:0; text-transform:none; }
    .q-item{
      display:flex; align-items:center; gap:8px;
      background:#fffdfa; border:1px solid var(--border);
      border-radius:8px; padding:8px 10px; margin-bottom:6px;
    }
    .q-item.invalid{ border-color:var(--error); background:#fdf1ef; }
    .q-info{ flex:1; min-width:0; }
    .q-oid{ color:var(--ink); font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .q-meta{ color:var(--muted); font-size:10px; margin-top:2px; }
    .q-meta.bad{ color:var(--error); }
    .q-qty{
      width:46px; background:#fff; border:1px solid var(--border); color:var(--ink);
      border-radius:6px; padding:6px 4px; text-align:center; font-size:13px;
    }
    .q-del{ color:var(--muted); font-size:16px; cursor:pointer; padding:0 4px; }

    #sync-bar{ display:flex; gap:8px; }
    #sync-bar .btn{ margin-bottom:0; }

    #log-title{ font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
    .log-item{
      display:flex; justify-content:space-between; align-items:center;
      background:#fffdfa; border:1px solid var(--border);
      border-radius:8px; padding:10px 14px; margin-bottom:6px;
    }
    .log-item .oid{ font-weight:600; font-size:13px; }
    .log-item .meta{ color:var(--muted); font-size:11px; }
  </style>
</head>
<body>

<div class="wrap">

  <h1>🌸 OMIOR — Stock Scanner</h1>
  <p class="subtitle">Scan order label QR code · queues locally · syncs in bulk</p>

  <div class="card">
    <h2>Scanner Setup</h2>
    <label>Your Name / Device Label</label>
    <input type="text" id="deviceName" placeholder="e.g. Rahul — Godown 1" oninput="saveDeviceName()">
  </div>

  <div class="card">
    <h2>Scan</h2>
    <button class="btn btn-primary" onclick="startLive()">📷 Live Camera Scan</button>
    <button id="stop-btn" class="btn btn-danger" onclick="stopLive()" style="display:none">⏹ Stop Camera</button>

    <label class="btn btn-secondary" for="qr-input">🖼️ Take Photo of Label</label>
    <input type="file" id="qr-input" accept="image/*" capture="environment" onchange="handleImage(event)">

    <div id="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div id="scan-line"></div>
      <div class="corner-br"></div>
      <div class="corner-bl"></div>
      <div id="flash-overlay">
        <div>
          <div class="ford" id="flash-order">—</div>
          <div class="fwarn" id="flash-warn" style="display:none"></div>
        </div>
      </div>
    </div>

    <div id="preview-wrap"><img id="preview"></div>
    <div id="status-box"></div>
  </div>

  <div class="card">
    <div id="queue-header">
      <span>Queued locally</span>
      <span id="queue-count">0 / 100</span>
    </div>
    <div id="queue"></div>

    <div id="sync-bar">
      <button class="btn btn-secondary" id="sync-btn" onclick="syncBatch()">⬆ Sync Now</button>
      <button class="btn btn-danger" id="clear-btn" onclick="clearQueue()" style="max-width:110px">Clear</button>
    </div>
  </div>

  <div class="card">
    <div id="log-title">Synced this session</div>
    <div id="log"></div>
  </div>

</div>

<script>
  // ============================================================
  // ⚠️ SET THIS after deploying code.gs as a Web App (Deploy > New
  // deployment > Web app > Execute as: Me, Who has access: Anyone)
  // Paste the /exec URL below.
  // ============================================================
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxuOYtPC5a4dMDZPxwQgLvHsfC49CI-eZ0g6-4xONd29rTlwPqvdbcVFm_Op_x_2MHMuQ/exec';

  var BATCH_LIMIT = 100;
  var mode = 'ready'; // fixed internally — no user-facing ready/delivered toggle for this project
  var config = { ranges: {} };
  var queue = [];      // [{id, orderId, qty, type, timestamp, valid, reason}]
  var syncing = false;

  var cooldown = false;
  var lastScanned = '';
  var liveStream = null;
  var liveScanning = false;
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var detector = null;
  var flashOverlay = document.getElementById('flash-overlay');

  if ('BarcodeDetector' in window) {
    detector = new BarcodeDetector({ formats: ['qr_code'] });
  }

  // ---------- device name (human-readable, configurable) ----------
  // Falls back to a short auto ID only if the person hasn't named this device yet,
  // so old rows stay distinguishable even before a name was set.
  function getAutoDeviceId() {
    var id = localStorage.getItem('omior_device_id');
    if (!id) {
      id = 'dev-' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('omior_device_id', id);
    }
    return id;
  }
  var autoDeviceId = getAutoDeviceId();

  function loadDeviceName() {
    var saved = localStorage.getItem('omior_device_name') || '';
    document.getElementById('deviceName').value = saved;
  }
  function saveDeviceName() {
    var val = document.getElementById('deviceName').value.trim();
    localStorage.setItem('omior_device_name', val);
  }
  function getDeviceLabel() {
    var name = (document.getElementById('deviceName').value || '').trim();
    return name ? name : autoDeviceId;
  }

  // ---------- status ----------
  function setStatus(msg, type) {
    var el = document.getElementById('status-box');
    el.textContent = msg;
    el.className = type;
  }

  // ---------- scan confirmation (flash + vibration) ----------
  var flashClearTimer = null;
  function flashConfirm(orderId, valid, reason) {
    var warnEl = document.getElementById('flash-warn');
    document.getElementById('flash-order').textContent = '#' + orderId;

    if (valid) {
      warnEl.style.display = 'none';
      warnEl.textContent = '';
    } else {
      warnEl.style.display = 'block';
      warnEl.textContent = '⚠ INVALID — ' + (reason || 'not accepted');
    }

    flashOverlay.className = valid ? 'show' : 'show invalid';
    if (navigator.vibrate) navigator.vibrate(valid ? 60 : [80, 80, 80, 80, 80]);

    if (flashClearTimer) clearTimeout(flashClearTimer);
    // invalid scans stay on screen noticeably longer so they don't get missed
    flashClearTimer = setTimeout(function () { flashOverlay.className = ''; }, valid ? 350 : 1400);
  }

  // ---------- config ----------
  function loadConfig() {
    if (WEB_APP_URL.indexOf('PASTE_YOUR') === 0) {
      setStatus('Set WEB_APP_URL in the script before use.', 'error');
      return;
    }
    fetch(WEB_APP_URL + '?action=config')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.success) {
          config = data;
          localStorage.setItem('omior_config_cache', JSON.stringify(data));
        } else {
          setStatus('Config error: ' + data.error, 'error');
        }
      })
      .catch(function () {
        // fall back to last known config if offline
        var cached = localStorage.getItem('omior_config_cache');
        if (cached) config = JSON.parse(cached);
        setStatus('Could not reach server — using cached ranges.', 'error');
      });
  }

  function validateLocally(orderId, type) {
    var range = config.ranges && config.ranges[type];
    if (!orderId) return { valid: false, reason: 'Empty order ID' };
    if (!range) return { valid: true, reason: '' }; // no config yet — let server decide
    var num = Number(orderId.replace(/[^0-9]/g, ''));
    if (isNaN(num) || num < range.min || num > range.max) {
      return { valid: false, reason: 'Out of range (' + range.min + '\u2013' + range.max + ')' };
    }
    return { valid: true, reason: '' };
  }

  // ---------- queue persistence ----------
  function loadQueue() {
    var saved = localStorage.getItem('omior_queue');
    queue = saved ? JSON.parse(saved) : [];
    renderQueue();
  }
  function saveQueue() {
    localStorage.setItem('omior_queue', JSON.stringify(queue));
  }

  function renderQueue() {
    var el = document.getElementById('queue');
    el.innerHTML = '';
    queue.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'q-item' + (item.valid ? '' : ' invalid');
      row.innerHTML =
        '<div class="q-info">' +
          '<div class="q-oid">' + item.orderId + '</div>' +
          '<div class="q-meta' + (item.valid ? '' : ' bad') + '">' + (item.valid ? 'looks valid' : item.reason) + '</div>' +
        '</div>' +
        '<input class="q-qty" type="number" min="1" value="' + item.qty + '" onchange="updateQty(\'' + item.id + '\', this.value)">' +
        '<span class="q-del" onclick="removeItem(\'' + item.id + '\')">✕</span>';
      el.appendChild(row);
    });
    document.getElementById('queue-count').textContent = queue.length + ' / ' + BATCH_LIMIT;
    document.getElementById('sync-btn').disabled = queue.length === 0 || syncing;
  }

  function updateQty(id, val) {
    var n = Number(val);
    if (!n || n < 1) n = 1;
    var item = queue.find(function (q) { return q.id === id; });
    if (item) { item.qty = n; saveQueue(); }
  }

  function removeItem(id) {
    queue = queue.filter(function (q) { return q.id !== id; });
    saveQueue();
    renderQueue();
  }

  function clearQueue() {
    if (!queue.length) return;
    if (!confirm('Clear all ' + queue.length + ' queued (unsynced) scans?')) return;
    queue = [];
    saveQueue();
    renderQueue();
  }

  // ---------- add scan to queue ----------
  function addToQueue(orderId) {
    if (!orderId) return;
    var check = validateLocally(orderId, mode);
    var entry = {
      id: 'q-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      orderId: orderId,
      qty: 1,
      type: mode,
      timestamp: Date.now(),
      valid: check.valid,
      reason: check.reason
    };
    queue.push(entry);
    saveQueue();
    renderQueue();

    // instant visual + haptic confirmation that the QR was read
    flashConfirm(orderId, check.valid, check.reason);

    if (check.valid) {
      setStatus('✓ Queued ' + orderId, 'success');
    } else {
      setStatus('✗ ' + orderId + ' — ' + check.reason, 'error');
    }

    if (queue.length >= BATCH_LIMIT) {
      syncBatch();
    }
  }

  // ---------- sync ----------
  function addLog(text, ok) {
    var log = document.getElementById('log');
    var item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = '<span class="oid" style="color:' + (ok ? 'var(--success)' : 'var(--error)') + '">' + text + '</span><span class="meta">' + new Date().toLocaleTimeString() + '</span>';
    log.insertBefore(item, log.firstChild);
  }

  function syncBatch() {
    if (syncing || !queue.length) return;
    if (WEB_APP_URL.indexOf('PASTE_YOUR') === 0) {
      setStatus('Set WEB_APP_URL in the script before syncing.', 'error');
      return;
    }
    syncing = true;
    renderQueue();
    setStatus('Syncing ' + queue.length + ' scans...', 'loading');

    var deviceLabel = getDeviceLabel();
    var payload = { deviceId: deviceLabel, entries: queue };

    fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        syncing = false;
        if (data.success) {
          setStatus('✓ Synced ' + data.inserted + ' scans (rows starting ' + data.startRow + ')', 'success');
          addLog('Synced ' + data.inserted + ' scans — ' + deviceLabel, true);
          queue = []; // whole batch accepted (valid + invalid both get logged server-side)
          saveQueue();
        } else {
          setStatus('✗ Sync failed: ' + data.error, 'error');
          addLog('Sync failed: ' + data.error, false);
        }
        renderQueue();
      })
      .catch(function (err) {
        syncing = false;
        setStatus('✗ Network error — will retry, scans kept locally.', 'error');
        addLog('Network error, batch kept locally', false);
        renderQueue();
      });
  }

  // ---------- LIVE CAMERA ----------
  function startLive() {
    setStatus('Starting camera...', 'loading');
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    })
      .then(function (stream) {
        liveStream = stream;
        video.srcObject = stream;
        video.play();
        document.getElementById('camera-wrap').style.display = 'block';
        document.getElementById('stop-btn').style.display = 'block';
        document.getElementById('status-box').style.display = 'none';
        liveScanning = true;
        if (detector) {
          scanWithDetector();
        } else {
          setStatus('Native scanner not available. Use Take Photo instead.', 'error');
        }
      })
      .catch(function () {
        setStatus('Camera blocked by browser.\n\nFix: Open Chrome → tap lock icon in address bar → allow Camera → reload.', 'error');
      });
  }

  function stopLive() {
    liveScanning = false;
    if (liveStream) liveStream.getTracks().forEach(function (t) { t.stop(); });
    document.getElementById('camera-wrap').style.display = 'none';
    document.getElementById('stop-btn').style.display = 'none';
  }

  function scanWithDetector() {
    if (!liveScanning) return;
    detector.detect(video)
      .then(function (codes) {
        if (codes.length > 0) handleScanValue(codes[0].rawValue);
        setTimeout(scanWithDetector, 300);
      })
      .catch(function () {
        setTimeout(scanWithDetector, 300);
      });
  }

  function handleScanValue(orderId) {
    if (!orderId || orderId === lastScanned || cooldown) return;
    lastScanned = orderId;
    cooldown = true;
    setTimeout(function () { cooldown = false; lastScanned = ''; }, 1500);
    addToQueue(orderId);
  }

  // ---------- PHOTO / TAKE PHOTO ----------
  function handleImage(event) {
    var file = event.target.files[0];
    if (!file) return;
    setStatus('Analysing image...', 'loading');

    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        document.getElementById('preview').src = e.target.result;
        document.getElementById('preview-wrap').style.display = 'block';

        if (detector) {
          detector.detect(img)
            .then(function (codes) {
              if (codes.length > 0) {
                handleScanValue(codes[0].rawValue);
              } else {
                tryRotations(img, 0);
              }
            })
            .catch(function (err) {
              setStatus('Detection error: ' + err.message, 'error');
            });
        } else {
          setStatus('BarcodeDetector not supported on this browser. Try Chrome on Android.', 'error');
        }
        document.getElementById('qr-input').value = '';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function tryRotations(img, attempt) {
    if (attempt >= 4) {
      setStatus('QR not found. Try again — hold phone steady, ensure QR is clear and well-lit.', 'error');
      return;
    }
    var angles = [90, 180, 270, 45];
    var angle = angles[attempt];
    var rad = angle * Math.PI / 180;

    var w = (angle === 90 || angle === 270) ? img.height : img.width;
    var h = (angle === 90 || angle === 270) ? img.width : img.height;

    canvas.width = w;
    canvas.height = h;
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(rad);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();

    var rotImg = new Image();
    rotImg.onload = function () {
      detector.detect(rotImg)
        .then(function (codes) {
          if (codes.length > 0) {
            handleScanValue(codes[0].rawValue);
          } else {
            tryRotations(img, attempt + 1);
          }
        })
        .catch(function () { tryRotations(img, attempt + 1); });
    };
    rotImg.src = canvas.toDataURL();
  }

  // ---------- init ----------
  loadDeviceName();
  loadConfig();
  loadQueue();
</script>
</body>
</html>
