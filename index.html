<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>OMIOR — Order Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #5fcf5f;
      --accent-dim: #0d2b0d;
      --accent-border: #1e4d1e;
    }
    body.mode-delivered {
      --accent: #cf5f5f;
      --accent-dim: #2b0d0d;
      --accent-border: #4d1e1e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 40px;
      transition: background 0.2s;
    }

    .logo    { font-size: 22px; font-weight: 700; letter-spacing: 3px; color: #fff; margin-bottom: 4px; }
    .tagline { font-size: 12px; color: #444; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px; }

    /* ── TABS ── */
    #tabs {
      width: 100%; max-width: 340px;
      display: flex; gap: 8px;
      background: #1a1a1a; border-radius: 14px;
      padding: 5px; margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1; padding: 12px 8px;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; background: transparent;
      color: #666; letter-spacing: 0.5px;
      transition: all 0.2s;
    }
    .tab-btn.active.ready    { background: #0d2b0d; color: #5fcf5f; }
    .tab-btn.active.delivered{ background: #2b0d0d; color: #cf5f5f; }

    .btn {
      padding: 18px 16px; border-radius: 14px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      width: 100%; max-width: 340px; text-align: center;
      margin-bottom: 12px; display: block; border: 1px solid var(--accent-border);
      background: var(--accent-dim); color: var(--accent);
      transition: opacity 0.15s, background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn:active { opacity: 0.7; }
    .btn-stop { background: #2b0d0d; color: #cf5f5f; border-color: #4d1e1e; }

    label.btn { text-decoration: none; }
    #qr-input { display: none; }

    /* ── CAMERA ── */
    #camera-wrap {
      width: 100%; max-width: 340px;
      margin-bottom: 12px; display: none;
      position: relative; border-radius: 16px;
      overflow: hidden; border: 2px solid var(--accent-border);
      transition: border-color 0.2s;
    }
    video { width: 100%; display: block; background: #111; }

    #scan-line {
      position: absolute; left: 5%; width: 90%; height: 2px;
      background: var(--accent); pointer-events: none;
      box-shadow: 0 0 10px var(--accent);
      animation: scan 1.4s ease-in-out infinite;
    }
    @keyframes scan { 0%{top:8%} 50%{top:88%} 100%{top:8%} }

    /* Brief flash confirmation instead of blocking overlay */
    #flash-overlay {
      position: absolute; inset: 0;
      background: var(--accent-dim);
      opacity: 0; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s;
    }
    #flash-overlay.show { opacity: 0.85; }
    #flash-overlay .ford {
      font-size: 28px; font-weight: 800; color: var(--accent);
    }

    #camera-wrap::before, #camera-wrap::after, .corner-br, .corner-bl {
      content: ''; position: absolute; width: 24px; height: 24px;
      border-color: var(--accent); border-style: solid; z-index: 3;
    }
    #camera-wrap::before { top:10px; left:10px;  border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    #camera-wrap::after  { top:10px; right:10px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .corner-br { bottom:10px; right:10px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
    .corner-bl { bottom:10px; left:10px;  border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }

    canvas { display: none; }

    /* ── STATUS ── */
    #status-box {
      width: 100%; max-width: 340px;
      padding: 14px; border-radius: 12px;
      font-size: 13px; font-weight: 500;
      text-align: center; display: none;
      margin-bottom: 12px; line-height: 1.5;
    }
    #status-box.success { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border); display: block; }
    #status-box.error   { background: #2b0d0d; color: #cf5f5f; border: 1px solid #4d1e1e; display: block; }
    #status-box.loading { background: #0d0d2b; color: #5f8fcf; border: 1px solid #1e1e4d; display: block; }

    /* ── COUNTERS ── */
    #counter-wrap {
      width: 100%; max-width: 340px;
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .counter-box {
      flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 10px; padding: 10px; text-align: center;
    }
    .counter-box .num { font-size: 22px; font-weight: 700; color: var(--accent); }
    .counter-box .lbl { font-size: 10px; color: #555; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

    /* ── QUEUE / LOG ── */
    #log-title {
      font-size: 11px; color: #444; letter-spacing: 1px;
      text-transform: uppercase; width: 100%; max-width: 340px;
      margin-bottom: 8px; display: flex; justify-content: space-between;
    }
    #log { width: 100%; max-width: 340px; }
    .log-item {
      display: flex; justify-content: space-between; align-items: center;
      border-radius: 10px; padding: 11px 14px; margin-bottom: 6px;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      transition: border-color 0.3s;
    }
    .log-item.pending { border-color: #2a2a55; }
    .log-item.done     { border-color: var(--accent-border); }
    .log-item.failed    { border-color: #4d1e1e; }
    .log-item .oid  { color: #fff; font-weight: 600; font-size: 15px; }
    .log-item .meta { color: #555; font-size: 11px; text-align: right; line-height: 1.6; }
    .badge {
      font-size: 10px; padding: 2px 7px; border-radius: 20px;
      font-weight: 600; margin-top: 3px; display: inline-block;
    }
    .badge-pending { background: #1e1e4d; color: #5f8fcf; }
    .badge-done    { background: var(--accent-dim); color: var(--accent); }
    .badge-error   { background: #4d1e1e; color: #cf5f5f; }
    .retry-link { font-size: 10px; color: #888; text-decoration: underline; cursor: pointer; margin-left: 6px; }
  </style>
</head>
<body class="mode-ready">

  <!-- ════════════════════════════════════════════
       PASTE YOUR GAS URL BELOW (between the quotes)
  ════════════════════════════════════════════ -->
  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbzoM7i9EeFJPv3YHTPsxy1qr7Tt1IFoK5ocg8EXBY2P-cs_PAMXhlfuP7Pc65CA4m32/exec';
  </script>

  <div class="logo">OMIOR</div>
  <div class="tagline">Order Scanner</div>

  <div id="tabs">
    <button class="tab-btn active ready" id="tab-ready" onclick="switchMode('ready')">✅ MARK READY</button>
    <button class="tab-btn delivered" id="tab-delivered" onclick="switchMode('delivered')">🚚 MARK DELIVERED</button>
  </div>

  <div id="counter-wrap">
    <div class="counter-box">
      <div class="num" id="count-today">0</div>
      <div class="lbl">Today</div>
    </div>
    <div class="counter-box">
      <div class="num" id="count-session">0</div>
      <div class="lbl">Session</div>
    </div>
    <div class="counter-box">
      <div class="num" id="count-pending">0</div>
      <div class="lbl">Uploading</div>
    </div>
  </div>

  <button class="btn" id="start-btn" onclick="startLive()">📷 Live Camera Scan</button>
  <button class="btn btn-stop" id="stop-btn" onclick="stopLive()" style="display:none">⏹ Stop Camera</button>

  <label class="btn" for="qr-input">🖼️ Scan from Photo</label>
  <input type="file" id="qr-input" accept="image/*" capture="environment" onchange="handleImage(event)">

  <div id="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="scan-line"></div>
    <div class="corner-br"></div>
    <div class="corner-bl"></div>
    <div id="flash-overlay"><div class="ford" id="flash-order">—</div></div>
  </div>

  <div id="status-box"></div>

  <div id="log-title"><span>Scan Queue</span><span id="mode-label">READY</span></div>
  <div id="log"></div>

<script>
  // ── STATE ──
  var currentMode  = 'ready'; // 'ready' or 'delivered'
  var liveStream   = null;
  var liveScanning = false;
  var sessionCount = 0;
  var pendingCount = 0;
  var detector     = null;

  var video   = document.getElementById('video');
  var canvas  = document.getElementById('canvas');
  var ctx     = canvas.getContext('2d');
  var camWrap = document.getElementById('camera-wrap');
  var flashOverlay = document.getElementById('flash-overlay');

  // Recently-queued dedupe: prevents the SAME qr code (held in frame for ~1-2s)
  // from being added to the queue multiple times. This does NOT block scanning
  // of a DIFFERENT code — that happens immediately.
  var recentlyQueued = {}; // { orderId: timestamp }
  var DEDUPE_WINDOW_MS = 3000;

  // Daily counters are tracked per-mode
  function todayKey(mode) { return 'omior_count_' + mode + '_' + new Date().toDateString(); }
  function loadTodayCount() {
    var v = parseInt(localStorage.getItem(todayKey(currentMode)) || '0');
    document.getElementById('count-today').textContent = v;
  }
  function bumpTodayCount() {
    var k = todayKey(currentMode);
    var v = parseInt(localStorage.getItem(k) || '0') + 1;
    localStorage.setItem(k, v);
    document.getElementById('count-today').textContent = v;
  }

  if ('BarcodeDetector' in window) {
    detector = new BarcodeDetector({ formats: ['qr_code'] });
  }

  // ── MODE SWITCH ──
  function switchMode(mode) {
    currentMode = mode;
    document.body.className = (mode === 'delivered') ? 'mode-delivered' : 'mode-ready';
    document.getElementById('tab-ready').classList.toggle('active', mode === 'ready');
    document.getElementById('tab-delivered').classList.toggle('active', mode === 'delivered');
    document.getElementById('mode-label').textContent = mode === 'delivered' ? 'DELIVERED' : 'READY';
    sessionCount = 0;
    document.getElementById('count-session').textContent = 0;
    document.getElementById('log').innerHTML = '';
    loadTodayCount();
    setStatus('', '');
    document.getElementById('status-box').style.display = 'none';
  }
  loadTodayCount();

  // ── STATUS ──
  function setStatus(msg, type) {
    var el = document.getElementById('status-box');
    el.textContent = msg;
    el.className = type;
  }

  function flashConfirm(orderId) {
    document.getElementById('flash-order').textContent = '#' + orderId;
    flashOverlay.classList.add('show');
    setTimeout(function() { flashOverlay.classList.remove('show'); }, 350);
  }

  // ── QUEUE LOG UI ──
  function addLogItem(orderId, queueId) {
    sessionCount++;
    document.getElementById('count-session').textContent = sessionCount;

    var log = document.getElementById('log');
    var item = document.createElement('div');
    item.className = 'log-item pending';
    item.id = 'log-' + queueId;
    item.innerHTML =
      '<span class="oid">#' + orderId + '</span>' +
      '<span class="meta">' + new Date().toLocaleTimeString() +
      '<br><span class="badge badge-pending" id="badge-' + queueId + '">Queued…</span></span>';
    log.insertBefore(item, log.firstChild);
  }

  function updateLogItem(queueId, state, info) {
    var item  = document.getElementById('log-' + queueId);
    var badge = document.getElementById('badge-' + queueId);
    if (!item || !badge) return;
    if (state === 'done') {
      item.className = 'log-item done';
      badge.className = 'badge badge-done';
      badge.textContent = '✓ Row ' + info;
    } else if (state === 'failed') {
      item.className = 'log-item failed';
      badge.className = 'badge badge-error';
      badge.innerHTML = '✗ Failed <span class="retry-link" onclick="retryItem(\'' + queueId + '\')">retry</span>';
    }
  }

  // ── NON-BLOCKING QUEUE UPLOAD ──
  // Each scan is queued and uploaded in the background. Scanning NEVER waits
  // for the network response — the camera keeps reading new codes immediately.
  var queueStore = {}; // queueId -> {orderId, mode}
  var qCounter = 0;

  function queueUpload(orderId) {
    var mode = currentMode;
    var now = Date.now();

    // Dedupe: skip if this exact code was queued in the last few seconds
    if (recentlyQueued[orderId] && (now - recentlyQueued[orderId]) < DEDUPE_WINDOW_MS) {
      return;
    }
    recentlyQueued[orderId] = now;

    // Instant feedback — does not wait for network
    if (navigator.vibrate) navigator.vibrate(60);
    flashConfirm(orderId);
    bumpTodayCount();

    var queueId = 'q' + (++qCounter);
    queueStore[queueId] = { orderId: orderId, mode: mode };
    addLogItem(orderId, queueId);

    pendingCount++;
    document.getElementById('count-pending').textContent = pendingCount;

    sendToSheet(queueId);
  }

  function sendToSheet(queueId) {
    var entry = queueStore[queueId];
    if (!entry) return;

    if (!GAS_URL || GAS_URL.indexOf('PASTE_YOUR') !== -1) {
      updateLogItem(queueId, 'failed');
      setStatus('⚠️ GAS URL not configured in index.html', 'error');
      pendingCount = Math.max(0, pendingCount - 1);
      document.getElementById('count-pending').textContent = pendingCount;
      return;
    }

    fetch(GAS_URL + '?orderId=' + encodeURIComponent(entry.orderId) + '&type=' + entry.mode)
      .then(function(r) { return r.json(); })
      .then(function(res) {
        pendingCount = Math.max(0, pendingCount - 1);
        document.getElementById('count-pending').textContent = pendingCount;
        if (res.success) {
          updateLogItem(queueId, 'done', res.row);
        } else {
          updateLogItem(queueId, 'failed');
        }
      })
      .catch(function() {
        pendingCount = Math.max(0, pendingCount - 1);
        document.getElementById('count-pending').textContent = pendingCount;
        updateLogItem(queueId, 'failed');
      });
  }

  function retryItem(queueId) {
    var item  = document.getElementById('log-' + queueId);
    var badge = document.getElementById('badge-' + queueId);
    if (item) item.className = 'log-item pending';
    if (badge) { badge.className = 'badge badge-pending'; badge.textContent = 'Retrying…'; }
    pendingCount++;
    document.getElementById('count-pending').textContent = pendingCount;
    sendToSheet(queueId);
  }

  // ── LIVE CAMERA ── (scanning loop never pauses for uploads)
  function startLive() {
    if (!detector) {
      setStatus('Live scan not supported here. Use Chrome on Android or Samsung Internet.', 'error');
      return;
    }
    setStatus('Starting camera...', 'loading');
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    })
    .then(function(stream) {
      liveStream = stream;
      video.srcObject = stream;
      video.play();
      camWrap.style.display = 'block';
      document.getElementById('stop-btn').style.display  = 'block';
      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('status-box').style.display = 'none';
      liveScanning = true;
      scanLoop();
    })
    .catch(function() {
      setStatus('📷 Camera blocked.\n\nFix: tap 🔒 in address bar → Permissions → Allow Camera → reload.', 'error');
    });
  }

  function stopLive() {
    liveScanning = false;
    if (liveStream) liveStream.getTracks().forEach(function(t) { t.stop(); });
    camWrap.style.display = 'none';
    document.getElementById('stop-btn').style.display  = 'none';
    document.getElementById('start-btn').style.display = 'block';
  }

  function scanLoop() {
    if (!liveScanning) return;
    detector.detect(video)
      .then(function(codes) {
        if (codes.length > 0) {
          queueUpload(codes[0].rawValue); // non-blocking — fires and continues
        }
        setTimeout(scanLoop, 120); // next frame check almost immediately
      })
      .catch(function() {
        setTimeout(scanLoop, 200);
      });
  }

  // ── PHOTO SCAN ──
  function handleImage(event) {
    var file = event.target.files[0];
    if (!file) return;
    if (!detector) {
      setStatus('BarcodeDetector not supported. Try Chrome on Android.', 'error');
      return;
    }
    setStatus('Analysing image...', 'loading');

    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        detector.detect(img)
          .then(function(codes) {
            if (codes.length > 0) {
              queueUpload(codes[0].rawValue);
              setStatus('', ''); document.getElementById('status-box').style.display = 'none';
            } else {
              tryRotations(img, 0);
            }
          })
          .catch(function(err) { setStatus('Detection error: ' + err.message, 'error'); });
        document.getElementById('qr-input').value = '';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function tryRotations(img, attempt) {
    if (attempt >= 4) {
      setStatus('QR not found. Hold steady, ensure QR is clear and well-lit.', 'error');
      return;
    }
    var angles = [90, 180, 270, 45];
    var angle  = angles[attempt];
    var rad    = angle * Math.PI / 180;
    var w = (angle === 90 || angle === 270) ? img.height : img.width;
    var h = (angle === 90 || angle === 270) ? img.width  : img.height;
    canvas.width = w; canvas.height = h;
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(rad);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();
    var rotImg = new Image();
    rotImg.onload = function() {
      detector.detect(rotImg)
        .then(function(codes) {
          if (codes.length > 0) {
            queueUpload(codes[0].rawValue);
          } else {
            tryRotations(img, attempt + 1);
          }
        })
        .catch(function() { tryRotations(img, attempt + 1); });
    };
    rotImg.src = canvas.toDataURL();
  }
</script>
</body>
</html>
