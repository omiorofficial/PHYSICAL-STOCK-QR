<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMIOR QR Scanner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }
    h2 { font-size: 15px; font-weight: 500; color: #aaa; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #555; margin-bottom: 16px; text-align: center; line-height: 1.6; }

    .wrap { width: 100%; max-width: 320px; }

    /* mode toggle */
    .mode-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
    .mode-btn {
      flex: 1; padding: 10px; border-radius: 10px; text-align: center;
      font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #2a2a2a;
      background: #161616; color: #666;
    }
    .mode-btn.active.ready { background: #1a3a1a; color: #6fcf6f; border-color: #2d5a2d; }
    .mode-btn.active.delivered { background: #1a1a3a; color: #6f9fcf; border-color: #2d2d5a; }

    .btn {
      padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 500;
      cursor: pointer; width: 100%; text-align: center; margin-bottom: 10px;
      display: block; border: none;
    }
    .btn-green { background: #1a3a1a; color: #6fcf6f; border: 1px solid #2d5a2d; }
    .btn-blue  { background: #1a1a3a; color: #6f9fcf; border: 1px solid #2d2d5a; }
    .btn-red   { background: #3a1a1a; color: #cf6f6f; border: 1px solid #5a2d2d; }
    .btn-amber { background: #3a2f1a; color: #cfa76f; border: 1px solid #5a4a2d; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    label.btn { text-decoration: none; }
    #qr-input { display: none; }

    #camera-wrap { width: 100%; margin-bottom: 10px; display: none; position: relative; }
    video { width: 100%; border-radius: 12px; display: block; background: #111; }
    #scan-line {
      position: absolute; left: 5%; width: 90%; height: 2px;
      background: #6fcf6f; pointer-events: none; box-shadow: 0 0 8px #6fcf6f;
      animation: scan 2s linear infinite;
    }
    @keyframes scan { 0%{top:10%} 50%{top:85%} 100%{top:10%} }
    canvas { display: none; }

    #preview-wrap { width: 100%; margin-bottom: 10px; display: none; }
    #preview { width: 100%; border-radius: 12px; display: block; }

    #status-box {
      width: 100%; padding: 12px 16px; border-radius: 10px;
      font-size: 13px; font-weight: 500; text-align: center; display: none;
      margin-bottom: 10px; line-height: 1.5;
    }
    #status-box.success { background: #1a3a1a; color: #6fcf6f; border: 1px solid #2d5a2d; display: block; }
    #status-box.error   { background: #3a1a1a; color: #cf6f6f; border: 1px solid #5a2d2d; display: block; }
    #status-box.loading { background: #1a1a3a; color: #6f9fcf; border: 1px solid #2d2d5a; display: block; }

    /* queue */
    #queue-header {
      display: flex; justify-content: space-between; align-items: baseline;
      margin: 6px 0 8px; font-size: 11px; color: #555; letter-spacing: 1px; text-transform: uppercase;
    }
    #queue-count { color: #ddd; font-weight: 700; font-size: 13px; letter-spacing: 0; text-transform: none; }
    #queue { width: 100%; margin-bottom: 10px; }
    .q-item {
      display: flex; align-items: center; gap: 8px;
      background: #161616; border: 1px solid #2a2a2a;
      border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
    }
    .q-item.invalid { border-color: #5a2d2d; background: #201414; }
    .q-info { flex: 1; min-width: 0; }
    .q-oid { color: #fff; font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q-meta { color: #666; font-size: 10px; margin-top: 2px; }
    .q-meta.bad { color: #cf6f6f; }
    .q-qty {
      width: 46px; background: #0f0f0f; border: 1px solid #333; color: #fff;
      border-radius: 6px; padding: 6px 4px; text-align: center; font-size: 13px;
    }
    .q-del { color: #666; font-size: 16px; cursor: pointer; padding: 0 4px; }

    #sync-bar { display: flex; gap: 8px; }
    #sync-bar .btn { margin-bottom: 0; }

    #log-title { font-size: 11px; color: #444; letter-spacing: 1px; text-transform: uppercase; width: 100%; margin: 16px 0 8px; }
    #log { width: 100%; }
    .log-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 8px; padding: 10px 14px; margin-bottom: 6px;
    }
    .log-item .oid { color: #fff; font-weight: 500; font-size: 13px; }
    .log-item .meta { color: #555; font-size: 11px; }
  </style>
</head>
<body>

  <h2>OMIOR — Scanner</h2>
  <p class="sub">Scan order label QR code · queues locally · syncs in bulk</p>

  <div class="wrap">

    <div class="mode-toggle">
      <div class="mode-btn ready active" id="mode-ready" onclick="setMode('ready')">READY</div>
      <div class="mode-btn delivered" id="mode-delivered" onclick="setMode('delivered')">DELIVERED</div>
    </div>

    <button class="btn btn-green" onclick="startLive()">📷 Live Camera Scan</button>
    <button id="stop-btn" class="btn btn-red" onclick="stopLive()" style="display:none">⏹ Stop Camera</button>

    <label class="btn btn-blue" for="qr-input">🖼️ Take Photo of Label</label>
    <input type="file" id="qr-input" accept="image/*" capture="environment" onchange="handleImage(event)">

    <div id="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div id="scan-line"></div>
    </div>

    <div id="preview-wrap"><img id="preview"></div>
    <div id="status-box"></div>

    <div id="queue-header">
      <span>Queued locally</span>
      <span id="queue-count">0 / 100</span>
    </div>
    <div id="queue"></div>

    <div id="sync-bar">
      <button class="btn btn-amber" id="sync-btn" onclick="syncBatch()">⬆ Sync Now</button>
      <button class="btn btn-red" id="clear-btn" onclick="clearQueue()" style="max-width:110px">Clear</button>
    </div>

    <div id="log-title">Synced this session</div>
    <div id="log"></div>

  </div>

<script>
  // ============================================================
  // ⚠️ SET THIS after deploying code.gs as a Web App (Deploy > New
  // deployment > Web app > Execute as: Me, Who has access: Anyone)
  // Paste the /exec URL below.
  // ============================================================
  var WEB_APP_URL = 'PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE';

  var BATCH_LIMIT = 100;
  var mode = 'ready';
  var config = { ranges: {} };
  var queue = [];      // [{id, orderId, qty, type, timestamp, valid, reason}]
  var syncing = false;

  var cooldown = false;
  var lastScanned = '';
  var liveStream = null;
  var liveScanning = false;
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var detector = null;

  if ('BarcodeDetector' in window) {
    detector = new BarcodeDetector({ formats: ['qr_code'] });
  }

  // ---------- device id ----------
  function getDeviceId() {
    var id = localStorage.getItem('omior_device_id');
    if (!id) {
      id = 'dev-' + Math.random().toString(36).slice(2, 8) + '-' + Date.now().toString(36);
      localStorage.setItem('omior_device_id', id);
    }
    return id;
  }
  var deviceId = getDeviceId();

  // ---------- mode ----------
  function setMode(m) {
    mode = m;
    document.getElementById('mode-ready').classList.toggle('active', m === 'ready');
    document.getElementById('mode-delivered').classList.toggle('active', m === 'delivered');
  }

  // ---------- status ----------
  function setStatus(msg, type) {
    var el = document.getElementById('status-box');
    el.textContent = msg;
    el.className = type;
  }

  // ---------- config ----------
  function loadConfig() {
    if (WEB_APP_URL.indexOf('PASTE_YOUR') === 0) {
      setStatus('Set WEB_APP_URL in the script before use.', 'error');
      return;
    }
    fetch(WEB_APP_URL + '?action=config')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.success) {
          config = data;
          localStorage.setItem('omior_config_cache', JSON.stringify(data));
        } else {
          setStatus('Config error: ' + data.error, 'error');
        }
      })
      .catch(function () {
        // fall back to last known config if offline
        var cached = localStorage.getItem('omior_config_cache');
        if (cached) config = JSON.parse(cached);
        setStatus('Could not reach server — using cached ranges.', 'error');
      });
  }

  function validateLocally(orderId, type) {
    var range = config.ranges && config.ranges[type];
    if (!orderId) return { valid: false, reason: 'Empty order ID' };
    if (!range) return { valid: true, reason: '' }; // no config yet — let server decide
    var num = Number(orderId.replace(/[^0-9]/g, ''));
    if (isNaN(num) || num < range.min || num > range.max) {
      return { valid: false, reason: 'Out of range (' + range.min + '\u2013' + range.max + ')' };
    }
    return { valid: true, reason: '' };
  }

  // ---------- queue persistence ----------
  function loadQueue() {
    var saved = localStorage.getItem('omior_queue');
    queue = saved ? JSON.parse(saved) : [];
    renderQueue();
  }
  function saveQueue() {
    localStorage.setItem('omior_queue', JSON.stringify(queue));
  }

  function renderQueue() {
    var el = document.getElementById('queue');
    el.innerHTML = '';
    queue.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'q-item' + (item.valid ? '' : ' invalid');
      row.innerHTML =
        '<div class="q-info">' +
          '<div class="q-oid">' + item.orderId + ' <span style="color:#555;font-weight:400">(' + item.type + ')</span></div>' +
          '<div class="q-meta' + (item.valid ? '' : ' bad') + '">' + (item.valid ? 'looks valid' : item.reason) + '</div>' +
        '</div>' +
        '<input class="q-qty" type="number" min="1" value="' + item.qty + '" onchange="updateQty(\'' + item.id + '\', this.value)">' +
        '<span class="q-del" onclick="removeItem(\'' + item.id + '\')">✕</span>';
      el.appendChild(row);
    });
    document.getElementById('queue-count').textContent = queue.length + ' / ' + BATCH_LIMIT;
    document.getElementById('sync-btn').disabled = queue.length === 0 || syncing;
  }

  function updateQty(id, val) {
    var n = Number(val);
    if (!n || n < 1) n = 1;
    var item = queue.find(function (q) { return q.id === id; });
    if (item) { item.qty = n; saveQueue(); }
  }

  function removeItem(id) {
    queue = queue.filter(function (q) { return q.id !== id; });
    saveQueue();
    renderQueue();
  }

  function clearQueue() {
    if (!queue.length) return;
    if (!confirm('Clear all ' + queue.length + ' queued (unsynced) scans?')) return;
    queue = [];
    saveQueue();
    renderQueue();
  }

  // ---------- add scan to queue ----------
  function addToQueue(orderId) {
    if (!orderId) return;
    var check = validateLocally(orderId, mode);
    var entry = {
      id: 'q-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      orderId: orderId,
      qty: 1,
      type: mode,
      timestamp: Date.now(),
      valid: check.valid,
      reason: check.reason
    };
    queue.push(entry);
    saveQueue();
    renderQueue();

    if (check.valid) {
      setStatus('✓ Queued ' + orderId + ' (' + mode + ')', 'success');
    } else {
      setStatus('✗ ' + orderId + ' — ' + check.reason, 'error');
    }

    if (queue.length >= BATCH_LIMIT) {
      syncBatch();
    }
  }

  // ---------- sync ----------
  function addLog(text, ok) {
    var log = document.getElementById('log');
    var item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = '<span class="oid" style="color:' + (ok ? '#6fcf6f' : '#cf6f6f') + '">' + text + '</span><span class="meta">' + new Date().toLocaleTimeString() + '</span>';
    log.insertBefore(item, log.firstChild);
  }

  function syncBatch() {
    if (syncing || !queue.length) return;
    if (WEB_APP_URL.indexOf('PASTE_YOUR') === 0) {
      setStatus('Set WEB_APP_URL in the script before syncing.', 'error');
      return;
    }
    syncing = true;
    renderQueue();
    setStatus('Syncing ' + queue.length + ' scans...', 'loading');

    var payload = { deviceId: deviceId, entries: queue };

    fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        syncing = false;
        if (data.success) {
          setStatus('✓ Synced ' + data.inserted + ' scans (rows starting ' + data.startRow + ')', 'success');
          addLog('Synced ' + data.inserted + ' scans — device ' + deviceId, true);
          queue = []; // whole batch accepted (valid + invalid both get logged server-side)
          saveQueue();
        } else {
          setStatus('✗ Sync failed: ' + data.error, 'error');
          addLog('Sync failed: ' + data.error, false);
        }
        renderQueue();
      })
      .catch(function (err) {
        syncing = false;
        setStatus('✗ Network error — will retry, scans kept locally.', 'error');
        addLog('Network error, batch kept locally', false);
        renderQueue();
      });
  }

  // ---------- LIVE CAMERA ----------
  function startLive() {
    setStatus('Starting camera...', 'loading');
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    })
      .then(function (stream) {
        liveStream = stream;
        video.srcObject = stream;
        video.play();
        document.getElementById('camera-wrap').style.display = 'block';
        document.getElementById('stop-btn').style.display = 'block';
        document.getElementById('status-box').style.display = 'none';
        liveScanning = true;
        if (detector) {
          scanWithDetector();
        } else {
          setStatus('Native scanner not available. Use Take Photo instead.', 'error');
        }
      })
      .catch(function () {
        setStatus('Camera blocked by browser.\n\nFix: Open Chrome → tap lock icon in address bar → allow Camera → reload.', 'error');
      });
  }

  function stopLive() {
    liveScanning = false;
    if (liveStream) liveStream.getTracks().forEach(function (t) { t.stop(); });
    document.getElementById('camera-wrap').style.display = 'none';
    document.getElementById('stop-btn').style.display = 'none';
  }

  function scanWithDetector() {
    if (!liveScanning) return;
    detector.detect(video)
      .then(function (codes) {
        if (codes.length > 0) handleScanValue(codes[0].rawValue);
        setTimeout(scanWithDetector, 300);
      })
      .catch(function () {
        setTimeout(scanWithDetector, 300);
      });
  }

  function handleScanValue(orderId) {
    if (!orderId || orderId === lastScanned || cooldown) return;
    lastScanned = orderId;
    cooldown = true;
    setTimeout(function () { cooldown = false; lastScanned = ''; }, 1500);
    addToQueue(orderId);
  }

  // ---------- PHOTO / TAKE PHOTO ----------
  function handleImage(event) {
    var file = event.target.files[0];
    if (!file) return;
    setStatus('Analysing image...', 'loading');

    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        document.getElementById('preview').src = e.target.result;
        document.getElementById('preview-wrap').style.display = 'block';

        if (detector) {
          detector.detect(img)
            .then(function (codes) {
              if (codes.length > 0) {
                handleScanValue(codes[0].rawValue);
              } else {
                tryRotations(img, 0);
              }
            })
            .catch(function (err) {
              setStatus('Detection error: ' + err.message, 'error');
            });
        } else {
          setStatus('BarcodeDetector not supported on this browser. Try Chrome on Android.', 'error');
        }
        document.getElementById('qr-input').value = '';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function tryRotations(img, attempt) {
    if (attempt >= 4) {
      setStatus('QR not found. Try again — hold phone steady, ensure QR is clear and well-lit.', 'error');
      return;
    }
    var angles = [90, 180, 270, 45];
    var angle = angles[attempt];
    var rad = angle * Math.PI / 180;

    var w = (angle === 90 || angle === 270) ? img.height : img.width;
    var h = (angle === 90 || angle === 270) ? img.width : img.height;

    canvas.width = w;
    canvas.height = h;
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(rad);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();

    var rotImg = new Image();
    rotImg.onload = function () {
      detector.detect(rotImg)
        .then(function (codes) {
          if (codes.length > 0) {
            handleScanValue(codes[0].rawValue);
          } else {
            tryRotations(img, attempt + 1);
          }
        })
        .catch(function () { tryRotations(img, attempt + 1); });
    };
    rotImg.src = canvas.toDataURL();
  }

  // ---------- init ----------
  loadConfig();
  loadQueue();
</script>
</body>
</html>
